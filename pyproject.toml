[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "goodpush"
dynamic = ["version"]        # from the git tag (vX.Y.Z, semantic versioning): hatch-vcs
description = "Personal cycling training analysis: Strava + Garmin -> power profile, training load, progress drivers and overreaching."
readme = "README.md"
requires-python = ">=3.12"      # garminconnect needs 3.12; 3.14 is the default (.python-version, uv)
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Leon Foks" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12",
    "h5py>=3.8",
    "tqdm>=4.60",
    "platformdirs>=4",
    "tomlkit>=0.13",
    "tzdata",
]

[project.optional-dependencies]
garmin = ["garminconnect>=0.3.19", "curl_cffi"]
physio = ["jax>=0.4.30", "numpyro>=0.15", "numba>=0.60", "filelock>=3.12"]   # Intel Mac: numba from conda-forge (no recent pip wheels)
ride = ["openant>=1.3", "pyusb>=1.2", "libusb-package", "bleak>=1.0", "PySide6-Essentials>=6.6"]
sync = ["cryptography>=42", "paramiko>=3.4"]    # goodpush peer: paired apps (https; its certificate), or over ssh
webview = ["goodpush[ride]", "PySide6-WebEngine"]   # spike: the app in its own window (launcher.AppWindow, GOODPUSH_WEBVIEW=1)
all = ["goodpush[garmin,physio,ride,sync]"]          # what the installed app bundles
dev = ["goodpush[all]", "pytest>=7", "hatchling>=1.26", "pre-commit>=3", "detect-secrets>=1.5"]
build = ["goodpush[all,webview]", "pyinstaller>=6.6", "pillow"]   # packaging/: the installers (pillow: the icon)
docs = ["goodpush[physio]", "sphinx>=7", "furo", "myst-parser>=4", "sphinxcontrib-bibtex>=2.6"]            # srcdocs/ -> docs/ (GitHub Pages)

[project.scripts]
goodpush = "goodpush.cli:main"
goodpush-app = "goodpush.launcher:main"   # the app: browser + tray icon (what the installers start)

# The version: the last tag vX.Y.Z on a release; between tags X.Y.(Z+1).devN+g<commit> (setuptools-scm's scheme).
# Release: git tag vX.Y.Z && git push origin vX.Y.Z (.github/workflows/build.yml builds the installers).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"        # no git (a source zip)

[tool.hatch.build.hooks.vcs]
version-file = "src/goodpush/_version.py"   # written on install / build; not in git

[tool.hatch.build.targets.wheel]
packages = ["src/goodpush"]       # every file in it (templates, front end, sync's .js) that git doesn't ignore

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]                 # pre-commit: what it checks on staged Python files
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E9", "F"]        # syntax errors, undefined names, unused imports / variables, redefinitions
