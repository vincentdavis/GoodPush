[package]
name = "goodpush-desktop"
version = "0.1.0"
description = "GoodPush as a desktop app: goodpush's server in a window of its own (tauri/README.md)"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2.8", features = [] }

[dependencies]
tauri = { version = "2.13", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
